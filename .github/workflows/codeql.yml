name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize]
  # Weekly baseline-drift scan; CodeQL queries evolve, so re-running on a
  # schedule catches newly-detectable issues even without code changes.
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    permissions:
      actions: read  # needed to read workflow run data
      contents: read
      security-events: write  # needed for SARIF upload
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      languages: python
      config-file: ./.github/codeql/codeql-config.yml
