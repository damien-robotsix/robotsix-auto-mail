name: Weekly container vulnerability rescan
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions: {}

concurrency:
  group: scan-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescan:
    name: Rescan container
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/scan-container.yml@d2a2353830cf211a9f18f3585085016766294dff
