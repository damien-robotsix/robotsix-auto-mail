name: Release image

# Publishes container images to GHCR through the shared
# robotsix-github-workflows `docker-release.yml` reusable workflow.
#
# Tags produced (docker/metadata-action in the reusable workflow):
#   push to `main`  -> `main`, `sha-<short>`
#   push of a `v*` tag -> `1.2.3`, `sha-<short>`
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fleet-standard publish path: metadata tags, provenance/SBOM
  # attestations, render-harden, assert-image-user, docker-smoke, the
  # Trivy gate and the Trivy SARIF upload all live in the reusable
  # workflow. The Dockerfile needs no build secrets (see ci.yml).
  publish:
    name: Publish container image
    permissions:
      contents: read
      packages: write         # needed to push container image to GHCR
      id-token: write         # provenance/SBOM attestation signing
      attestations: write     # provenance/SBOM attestation signing
      security-events: write  # needed for Trivy SARIF upload
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@92c11fd2be7a9ce80bd60208616271326e0fb08a  # 92c11fd 2026-10-26
    with:
      trivyignores: .trivyignore

  sbom:
    name: Generate SBOM
    permissions:
      contents: read
    uses: $/.github/workflows/sbom.yml

  release-notes:
    name: Create GitHub Release
    needs: [publish, sbom]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the GitHub Release
      actions: read  # needed to download workflow artifacts
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cyclonedx-sbom

      # release-please creates the GitHub Release (with the CHANGELOG notes)
      # together with the tag, so by the time this tag push runs the Release
      # already exists: attach the SBOM instead of re-creating it. Only a
      # hand-made tag has no Release yet. `gh` needs GH_TOKEN in Actions
      # (every tag since v0.10.0 failed here with exit 4, 2026-10-28).
      - name: Attach SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" sbom.cdx.json --clobber
          else
            gh release create "$REF_NAME" sbom.cdx.json \
              --title "$REF_NAME" --generate-notes
          fi
