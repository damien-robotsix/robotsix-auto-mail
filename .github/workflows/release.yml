name: Release image

# Publishes container images to GHCR through the shared
# robotsix-github-workflows `docker-release.yml` reusable workflow.
#
# Tags produced (docker/metadata-action in the reusable workflow):
#   push to `main`  -> `main`, `sha-<short>`
#   push of a `v*` tag -> `1.2.3`, `sha-<short>`
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fleet-standard publish path: metadata tags, provenance/SBOM
  # attestations, render-harden, assert-image-user, docker-smoke, the
  # Trivy gate and the Trivy SARIF upload all live in the reusable
  # workflow. The Dockerfile needs no build secrets (see ci.yml).
  publish:
    name: Publish container image
    permissions:
      contents: read
      packages: write         # needed to push container image to GHCR
      id-token: write         # provenance/SBOM attestation signing
      attestations: write     # provenance/SBOM attestation signing
      security-events: write  # needed for Trivy SARIF upload
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@92c11fd2be7a9ce80bd60208616271326e0fb08a  # main
    with:
      trivyignores: .trivyignore
    secrets: inherit

  sbom:
    name: Generate SBOM
    permissions:
      contents: read
    uses: $/.github/workflows/sbom.yml

  release-notes:
    name: Create GitHub Release
    needs: [publish, sbom]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the GitHub Release
      actions: read  # needed to download workflow artifacts
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-project

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cyclonedx-sbom

      - name: Extract release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"
          VERSION="${TAG#v}"
          # Extract the section for this version; if none found, use the
          # "unreleased" section as fallback.
          awk -v ver="${VERSION}" '
            /^## / { if (found) exit; if ($0 ~ ver) found=1; next }
            found { print }
          ' CHANGELOG.md > /tmp/release_body.md
          if [ ! -s /tmp/release_body.md ]; then
            echo "No changelog section for ${VERSION} — using unreleased section"
            awk '
              /^## 0\.0\.0 \(unreleased\)/ { found=1; next }
              found && /^## [0-9]/ { exit }
              found
            ' CHANGELOG.md > /tmp/release_body.md
          fi

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" sbom.cdx.json \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release_body.md
