name: CI

on:
  push:
    branches: ["**"]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - 'src/**'
      - 'tests/**'
      # `Repository checks` validates the registration of EVERY file, not
      # just Python ones. Without these, a failure caused by a non-Python
      # file cannot be cleared by removing that file: the fix does not
      # match the filter, CI never re-runs, and main keeps the stale red
      # while mill parks every ticket as main-debt.
      - 'docs/modules.yaml'
      - 'changelog.d/**'
      - '.github/workflows/**'
  # Lets a stale failure be cleared without an empty commit.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reusable Python-CI spine shared across robotsix repos. This single call
  # replaces the inline ruff/mypy/deptry/pytest+coverage/bandit steps that used
  # to be hand-rolled here.
  ci:
    # python-ci.yml's `tests` job uploads SARIF, so it requests
    # security-events: write — a caller job must grant at least that or
    # GitHub rejects the call ("nested job 'tests' is requesting
    # 'security-events: write'"). Mirrors mill's own caller.
    name: Python CI
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload from reusable workflow
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@e94a9aad6c4d6753c860520ba49b6a94a59ceb55  # main
    with:
      python-version: "3.14"
      install-extras: "dev"
      cov-package: robotsix_auto_mail
      coverage-threshold: "80"
      mypy-advisory: false        # auto-mail runs `mypy --strict` as a BLOCKING gate; it must NOT become advisory
      run-deptry: true
      run-bandit: true
      # No --randomly-seed=last here. `last` resolves the seed from
      # .pytest_cache, which CI never persists, so each xdist worker resolved
      # its own — intermittently producing different collection orders and
      # tripping xdist's own consistency guard ("Different tests were collected
      # between gw1 and gw3", same 1,882 tests). With `-x` in the shared
      # workflow that surfaced as a misleading coverage failure. Omitting the
      # flag lets pytest-randomly pick one seed on the controller and propagate
      # it, which keeps order randomisation without the divergence.
      pytest-args: --hypothesis-profile=ci --cov-report=xml:coverage.xml

  # auto-mail-specific checks with no equivalent in the reusable spine. They
  # keep their own steps and stay blocking on every push + PR.
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
      pull-requests: read  # needed to check PR event metadata

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6  # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      # --frozen uses uv.lock as-is and FAILS if pyproject.toml was changed
      # without re-running `uv lock` — guaranteeing the committed lockfile is
      # the single source of truth for the resolved dependency tree.
      # --extra dev pulls the dev tooling (ruff/mypy/pytest/...) which lives
      # in [project.optional-dependencies]; uv does not install extras by
      # default.
      - name: Install dependencies
        env:
          UV_MALWARE_CHECK: 1
        run: uv sync --frozen --extra dev

      - name: Dependency vulnerability audit
        run: UV_PREVIEW=1 uv audit --frozen

      - name: Check config sync
        run: uv run --frozen python scripts/config/check_config_sync.py

      - name: Validate module taxonomy
        run: uv run --frozen robotsix-modules validate docs/modules.yaml

      - name: Check module registration completeness
        run: uv run --frozen robotsix-modules check-registration docs/modules.yaml --root .


      - name: Dead code detection (vulture)
        run: uv run --frozen vulture src/robotsix_auto_mail/ vulture_whitelist.py

      - name: Install Deno
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Resolve latest v2.x release via GitHub API (authenticated to avoid rate limiting on shared runners)
          V2_TAG=$(curl --retry 3 -sSf -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/denoland/deno/releases?per_page=30 \
            | python3 -c "import sys,json; [print(r['tag_name']) for r in json.load(sys.stdin) if r['tag_name'].startswith('v2.')]" \
            | head -1)
          echo "Installing Deno ${V2_TAG}"
          curl --retry 3 -fsSL "https://github.com/denoland/deno/releases/download/${V2_TAG}/deno-x86_64-unknown-linux-gnu.zip" -o deno.zip
          unzip -q deno.zip
          mkdir -p "$HOME/.deno/bin"
          mv deno "$HOME/.deno/bin/"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Lint JavaScript
        run: deno lint src/robotsix_auto_mail/server/static/board-auto-mail.js

      - name: Check JavaScript formatting
        run: deno fmt --check src/robotsix_auto_mail/server/static/board-auto-mail.js

      - name: Check CSS formatting
        run: deno fmt --check src/robotsix_auto_mail/server/static/board.css

      - name: Validate pyproject.toml (validate-pyproject)
        run: uvx 'validate-pyproject[all,store]'

      - name: Scan GitHub Actions workflows (zizmor)
        run: uv run --frozen zizmor --format=sarif .github/workflows/ > zizmor-results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v3
        with:
          sarif_file: zizmor-results.sarif

  # Reusable Python-security spine shared across robotsix repos. This single
  # call replaces the inline TruffleHog secret-scan / pip-audit steps that
  # used to be hand-rolled here.
  security:
    name: Security scans
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload from reusable workflow
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@e94a9aad6c4d6753c860520ba49b6a94a59ceb55  # main
    with:
      python-version: "3.14"
      install-extras: "dev"
      # Full-checkout secret scan, matching the previous `path: ./` (no PR diff).
      run-trufflehog: true
      trufflehog-pr-diff: false
      # Exclude TruffleHog's Lob detector: this repo has no Lob integration.
      # The full git-history scan flags a stale test-fixture string from an
      # earlier branch commit as a "verified" Lob test-mode key — a false
      # positive (Lob test keys are non-sensitive by design). Mirrors
      # .gitleaks.toml, which already treats tests/ as fixture-only.
      trufflehog-extra-args: "--exclude-detectors=lob"
      # Locked-requirements audit: export uv.lock to this file, then run
      # `pip-audit -r`. Drops the four first-party VCS packages, which are not
      # on PyPI and break pip's --require-hashes mode. Also drops the root
      # project robotsix-auto-mail itself: its editable `-e .` form has no
      # hashable single file under pip's --require-hashes mode, which aborts
      # pip-audit.
      run-pip-audit: true
      pip-audit-requirements-file: requirements-locked.txt
      pip-audit-ignore-packages: "robotsix-config robotsix-board robotsix-auto-mail robotsix-llmio robotsix-modules robotsix-http"

  # CycloneDX SBOM generated via reusable workflow (.github/workflows/sbom.yml).
  sbom:
    name: Generate SBOM
    permissions:
      contents: read
    uses: ./.github/workflows/sbom.yml

  # Diff-scoped dependency review gate on pull requests. Uses GitHub's
  # dependency-review-action to (a) block PRs that add dependencies with known
  # CVEs rated moderate or higher and (b) deny strong-copyleft licenses
  # incompatible with this project's MIT license.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # needed for comment-summary-in-pr
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5
        with:
          fail-on-severity: moderate
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later
          comment-summary-in-pr: true

  # PR-only job: posts a per-file coverage diff PR comment.  This is
  # INFORMATIONAL — the actual blocking coverage gate is --cov-fail-under=80
  # inside the reusable, enforced in the `ci` job above.
  #
  # Coverage data is produced by the reusable python-ci.yml workflow and
  # downloaded here via the coverage-data artifact.  That artifact currently
  # carries only coverage.xml: this repo sets `parallel = true`, so coverage
  # writes `.coverage.<host>.<pid>.<rand>` files, nothing runs `coverage
  # combine`, and the reusable workflow's literal `.coverage` upload path
  # matches no file.  Both the comment action and `coverage html` need that
  # combined database, so both fail with "No data to report".
  #
  # Because this job is informational it must never gate a merge.  Every step
  # carries continue-on-error, not just the job: a job-level flag still leaves
  # the *check-run* reported as failed, and mill classifies a failed check-run
  # as a terminal CI failure — which is precisely what feeds the ci_fix
  # no-op-commit loop.  Fixing the artifact itself is a robotsix-github-workflows
  # change, tracked separately.
  coverage-comment:
    name: Coverage comment
    if: github.event_name == 'pull_request'
    needs: [ci]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write  # needed to post PR comment
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0    # full history needed for coverage diff

      - uses: ./.github/actions/setup-project

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-data

      - name: Post coverage PR comment
        id: coverage-comment
        continue-on-error: true
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4  # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: false

      # Posting a PR comment is reporting, not a merge gate. Without this the
      # retry fails hard whenever the underlying failure is *persistent* rather
      # than transient, which fails the whole CI workflow on every PR — and
      # mill's ci_fix then loops forever pushing no-op commits at a run that
      # can never go green.
      - name: Retry coverage PR comment on transient failure
        if: steps.coverage-comment.outcome == 'failure'
        continue-on-error: true
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4  # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: false

      - name: Generate HTML coverage report
        continue-on-error: true
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run coverage html --directory=coverage_html

      - name: Upload HTML report
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-html-report
          path: coverage_html/
          if-no-files-found: ignore
          retention-days: 7
