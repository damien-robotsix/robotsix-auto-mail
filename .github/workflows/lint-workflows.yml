name: Lint workflows
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: lint-workflows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@fb907a46b00693a117ca6b975da6e7b0f8238491  # main
    with:
      run-actionlint: true
      run-zizmor: true
