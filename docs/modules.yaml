# Canonical module taxonomy for robotsix-auto-mail.
#
# Each module declares an id, a human-readable description, and the
# set of repo-relative file paths it owns.  Every file in the repo
# must belong to exactly one module.  Paths use forward slashes.
#
# This file is the source of truth for drift detection: any file not
# listed here is "unclassified"; any listed path that no longer exists
# is "stale"; any new module proposal must start by adding an entry here.

modules:
  - id: core
    description: >-
      Project root, package identity, build configuration, roadmap,
      and observability/logging/tracing startup.
    paths:
      - src/robotsix_auto_mail/__init__.py
      - src/robotsix_auto_mail/errors.py
      - src/robotsix_auto_mail/py.typed
      - src/robotsix_auto_mail/core/__init__.py
      - src/robotsix_auto_mail/core/_constants.py
      - src/robotsix_auto_mail/core/_llm_agent.py
      - src/robotsix_auto_mail/core/_observability.py
      - src/robotsix_auto_mail/core/format.py
      - src/robotsix_auto_mail/core/health.py
      - tests/core/__init__.py
      - tests/core/test_format.py
      - tests/core/test_health.py
      - tests/core/test_llm_agent.py
      - tests/core/test_observability_logging.py
      - tests/core/test_observability_tracing.py
      - pyproject.toml
      - uv.lock
      - vulture_whitelist.py
      - .gitignore
      - .python-version
      - .github/CODE_OF_CONDUCT.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - LICENSE
      - AGENT.md
      - README.md
      - SECURITY.md
      - ROADMAP.md
      - changelog/.gitkeep
      - changelog/*.md
      - tests/__init__.py
      - tests/conftest.py
      - tests/test_stub.py

  - id: docker
    description: >-
      Docker image definition, Compose orchestration, and
      container entrypoint.
    paths:
      - .dockerignore
      - Dockerfile
      - docker-compose.yml
      - entrypoint.sh

  - id: deploy
    description: >-
      central-deploy contract (contract-version 1): the Compose file
      that the external central-deploy system consumes to pull the
      published GHCR image and run the ingester + board services, plus
      the managed config template. Operator-facing deployment docs live
      in docs/deployment.md.
    paths:
      - deploy/docker-compose.yml

  - id: dev
    description: >-
      Developer and deployment helper scripts.
    paths:
      - scripts/dev/auto-mail-autoupdate.sh
      - src/robotsix_auto_mail/dev/__init__.py
      - src/robotsix_auto_mail/dev/autoupdate.py
      - tests/dev/__init__.py
