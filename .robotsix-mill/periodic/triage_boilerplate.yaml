name: triage_boilerplate
prompt_overlay: |
  When generating boilerplate for scope-triage decisions, include the
  following pattern for tickets that touch CHANGELOG.md, docs/modules.yaml,
  or add new changelog/*.md fragment files.  These are legitimate
  accompanying documentation/registry updates, never scope creep.

  The boilerplate response template:

  **Triage decision: EXPAND — Accompanying Documentation.**

  All flagged files are legitimate accompanying documentation/registry
  updates that record the change made in the ticket:

  - **CHANGELOG.md:** Keeping the changelog in sync with the work performed
    is not scope creep.
  - **docs/modules.yaml:** The registry update registers a new changelog
    entry file that was created by the ticket — this is a direct
    consequence of the ticket's work.
  - **changelog/*.md:** A changelog fragment file generated as part of the
    ticket's change process to document the fix.  It is a normal
    consequence of the ticket's work.

  No unrelated files were modified.  Proceed.

  ---

  When generating boilerplate for completeness_check tickets where the
  gap description matches "Missing re-export: X not exposed through
  Y/__init__.py", include the following pattern.  These are packaging
  consistency fixes — a public function is defined in a submodule,
  has production callers and dedicated tests, but was accidentally
  omitted from the package's __init__.py while all of its sibling
  public symbols are properly re-exported.

  The boilerplate response template:

  **Triage decision: ACCEPT — Packaging consistency fix.**

  This is a packaging consistency gap: `[SYMBOL_NAME]` is a public
  function in `[submodule]` with production callers and dedicated
  tests, but it is not re-exported through `[package]/__init__.py`.
  All `[N]` sibling public functions from the same submodule ARE
  properly exported — this appears to be an oversight.

  **Risk:** Minimal. The fix is purely additive (import + `__all__`
  entry). Existing callers using the submodule path continue to work;
  new callers gain the canonical import path.

  **Priority:** Low. No behavior change, no regression risk.

  **Verification:** Confirm the symbol is public (no underscore
  prefix), has test coverage, and all siblings are already exported
  before implementing.

  ---

  When a ticket was filed by a deterministic periodic agent (audit,
  bc_check, module_size, copy_paste, test_gap, docstring_coverage)
  where the proposal is rule-based, mechanical, and carries no design
  risk, include the following pattern.  These are implementation-ready
  tickets — they name exact files, exact symbols, and require no design
  decisions.

  This applies ONLY when:
  - The ticket identifies a specific, well-scoped issue (dead code
    pattern, missing docstring, untested module, file that should be
    split).
  - The proposal is mechanical — it names exact files, exact symbols,
    and often suggests exact fix text.
  - No design decisions are required; the fix follows established
    project conventions.
  - The ticket was generated by a deterministic scan, not by human
    judgment.
  - Risk is inherently low: docstrings are additive, dead code removal
    is no-op, test splits preserve all coverage.

  This does NOT apply when:
  - The periodic agent proposes a complex refactoring with design
    trade-offs (e.g., module reorganization from module_curator).
  - The proposal touches security boundaries, public API, or
    cross-repo contracts.
  - The proposal introduces new external dependencies.
  - The draft lacks sufficient specificity (e.g., vague "improve X"
    without concrete changes).

  The boilerplate response template:

  **Triage decision: APPROVE — Deterministic Periodic-Agent Proposal.**

  This ticket was filed by `[source]`, a deterministic periodic agent
  whose proposals are rule-based and mechanical. The draft is
  implementation-ready — it names exact files, exact changes, and
  requires no design decisions.

  **Source:** `[source]` (deterministic rule: mill-internal
  periodic-agent proposal, no design risk).

  **Risk:** Low. The change is mechanical and well-scoped: `[one-line
  summary of what changes]`.

  **Verification:** Confirm the proposal is properly grounded before
  implementing:
  - The file(s) named in the ticket exist on disk.
  - The described problem is real (e.g., the function truly lacks a
    docstring, the dead code pattern is genuinely unreachable, the
    test file truly exceeds the line threshold).
  - The proposed fix follows existing project conventions.
